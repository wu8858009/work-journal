<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>工作週誌</title>
<meta name="theme-color" content="#1c1c1f" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon.svg" />
<link rel="stylesheet" href="./styles.css?v=20260914h" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem("wj_theme");
      if (saved === "dark" || saved === "light") {
        document.documentElement.dataset.theme = saved;
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
  <div id="login-screen" class="login-screen">
    <button type="button" class="theme-toggle-btn" id="theme-toggle-login" title="切換深色模式">
      <svg class="theme-toggle-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" stroke-linecap="round"/></svg>
      <svg class="theme-toggle-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke-linejoin="round"/></svg>
    </button>
    <form id="login-form" class="login-card">
      <h1 class="login-title">工作週誌</h1>
      <p class="login-sub">請登入以繼續使用</p>
      <label class="field-label">餐廳</label>
      <select id="login-department" class="field-input field-select"></select>
      <label class="field-label">帳號</label>
      <input type="text" id="login-username" class="field-input" autocomplete="username" required />
      <label class="field-label">密碼</label>
      <div class="field-password-wrap">
        <input type="password" id="login-password" class="field-input" autocomplete="current-password" required />
        <button type="button" class="field-password-toggle" id="login-password-toggle" title="顯示密碼" aria-label="顯示密碼">
          <svg class="pw-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="pw-eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18" stroke-linecap="round"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.4 4.3M6.5 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 3.6-.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 10a3 3 0 0 0 4.2 4.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <label class="checkbox-row login-remember-row">
        <input type="checkbox" id="login-remember" checked />
        <span>記住我（保持登入狀態）</span>
      </label>
      <p class="login-error hidden" id="login-error"></p>
      <p class="login-notice hidden" id="login-notice"></p>
      <button type="submit" class="btn btn-primary login-submit" id="login-submit-btn">登入</button>
      <p class="login-switch"><a href="#" id="show-forgot-link">忘記密碼？</a></p>
    </form>

    <form id="signup-form" class="login-card hidden">
      <h1 class="login-title">建立帳號</h1>
      <p class="login-sub">註冊一般使用者帳號</p>
      <label class="field-label">帳號</label>
      <input type="text" id="signup-username" class="field-input" autocomplete="username" required />
      <label class="field-label">顯示名稱</label>
      <input type="text" id="signup-displayname" class="field-input" placeholder="預設與帳號相同" />
      <label class="field-label">密碼</label>
      <div class="field-password-wrap">
        <input type="password" id="signup-password" class="field-input" autocomplete="new-password" required />
        <button type="button" class="field-password-toggle" id="signup-password-toggle" title="顯示密碼" aria-label="顯示密碼">
          <svg class="pw-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="pw-eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18" stroke-linecap="round"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.4 4.3M6.5 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 3.6-.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 10a3 3 0 0 0 4.2 4.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p class="login-error hidden" id="signup-error"></p>
      <button type="submit" class="btn btn-primary login-submit" id="signup-submit-btn">註冊</button>
      <p class="login-switch">已經有帳號？<a href="#" id="show-login-link">登入</a></p>
    </form>

    <form id="forgot-form" class="login-card hidden">
      <h1 class="login-title">忘記密碼</h1>
      <p class="login-sub">提出申請後，請等待管理員設定新密碼</p>
      <label class="field-label">帳號</label>
      <input type="text" id="forgot-username" class="field-input" autocomplete="username" required />
      <p class="login-error hidden" id="forgot-error"></p>
      <button type="submit" class="btn btn-primary login-submit" id="forgot-submit-btn">送出申請</button>
      <p class="login-switch">想起密碼了？<a href="#" id="show-login-from-forgot-link">登入</a></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <header class="app-header">
      <div class="header-titles">
        <div class="header-title" id="header-title">工作週誌</div>
        <div class="header-sub" id="header-sub">工作週誌</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn header-action" id="theme-toggle-app" title="切換深色模式">
          <svg class="theme-toggle-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" stroke-linecap="round"/></svg>
          <svg class="theme-toggle-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn header-action hidden" id="export-btn" title="匯出 / 列印">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2M6 14h12v7H6z" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <main id="view-root" class="view-root"></main>

    <button class="fab hidden" id="fab-add-item" title="新增項目">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
    </button>

    <nav class="bottom-nav">
      <button class="nav-btn" data-view="editor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke-linejoin="round"/><path d="M14 3v4h4M9 12h6M9 16h6M9 8h2"/></svg>
        <span>週誌</span>
      </button>
      <button class="nav-btn" data-view="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span>歷史</span>
      </button>
      <button class="nav-btn" data-view="timers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4l2.8 1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 2h6" stroke-linecap="round"/></svg>
        <span>定時器</span>
      </button>
      <button class="nav-btn" data-view="maintenance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="17" rx="1.5"/><path d="M9 2.5h6a1 1 0 0 1 1 1V5H8V3.5a1 1 0 0 1 1-1Z" stroke-linejoin="round"/><path d="m8 13 2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 17h8" stroke-linecap="round"/></svg>
        <span>保養排程</span>
      </button>
      <button class="nav-btn" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.97 7.97 0 0 0 0-3l1.7-1.3-2-3.4-2 .6a8 8 0 0 0-2.6-1.5L14 2h-4l-.5 2.9a8 8 0 0 0-2.6 1.5l-2-.6-2 3.4L4.6 10.5a7.97 7.97 0 0 0 0 3L2.9 14.8l2 3.4 2-.6a8 8 0 0 0 2.6 1.5L10 22h4l.5-2.9a8 8 0 0 0 2.6-1.5l2 .6 2-3.4Z" stroke-linejoin="round"/></svg>
        <span>設定</span>
      </button>
    </nav>
  </div>

  <!-- Item modal -->
  <div class="modal-backdrop" id="modal-item">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 id="item-modal-title">新增項目</h3>
        <button class="icon-btn" id="item-cancel-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field-label" id="item-field-category-label">類別</label>
        <select id="item-field-category" class="field-input field-select"></select>

        <label class="field-label">工作項目</label>
        <input type="text" id="item-field-name" class="field-input" placeholder="例如：碧水堂洗區水龍頭高壓軟管破管" />

        <label class="field-label">負責人</label>
        <input type="text" id="item-field-assignee" class="field-input" placeholder="例如：志豪哥" />

        <label class="field-label">目前進度說明</label>
        <textarea id="item-field-progress" class="field-input field-textarea" placeholder="例如：已聯絡廠商報價中"></textarea>

        <label class="field-label">預計完成日期</label>
        <input type="date" id="item-field-date" class="field-input" />

        <label class="field-label">完成度</label>
        <select id="item-field-percent" class="field-input field-select">
          <option value="0">0%</option>
          <option value="10">10%</option>
          <option value="20">20%</option>
          <option value="30">30%</option>
          <option value="40">40%</option>
          <option value="50">50%</option>
          <option value="60">60%</option>
          <option value="70">70%</option>
          <option value="80">80%</option>
          <option value="90">90%</option>
          <option value="100">100%</option>
        </select>

        <label class="checkbox-row">
          <input type="checkbox" id="item-field-priority" />
          <span>需優先處理</span>
        </label>

        <label class="field-label">照片</label>
        <div class="photo-grid" id="item-field-photos"></div>
        <div class="photo-add-row">
          <button type="button" class="btn btn-ghost photo-add-btn" id="item-photo-camera-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" stroke-linejoin="round"/><circle cx="12" cy="14" r="3.4"/></svg>
            <span>拍照</span>
          </button>
          <button type="button" class="btn btn-ghost photo-add-btn" id="item-photo-gallery-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m5 17 5-5 3.5 3.5L17 12l3 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>從相簿新增</span>
          </button>
          <input type="file" id="item-photo-camera-input" accept="image/*" capture="environment" class="hidden" />
          <input type="file" id="item-photo-gallery-input" accept="image/*" multiple class="hidden" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger-outline hidden" id="item-delete-btn">刪除</button>
        <div class="modal-footer-right">
          <button class="btn btn-ghost" id="item-cancel-footer-btn">取消</button>
          <button class="btn btn-primary" id="item-save-btn">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Photo editor modal (draw / add text on a photo) -->
  <div class="modal-backdrop" id="modal-photo-editor">
    <div class="modal-sheet modal-sheet-lg photo-editor-sheet">
      <div class="modal-header">
        <h3>編輯照片</h3>
        <button class="icon-btn" id="photo-editor-close-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="photo-editor-toolbar">
        <button type="button" class="icon-btn photo-tool-btn active" id="photo-tool-pen" data-tool="pen" title="畫筆">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16.5 3.5a2 2 0 0 1 3 3L7 19l-4 1 1-4Z" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="icon-btn photo-tool-btn" id="photo-tool-text" data-tool="text" title="文字">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5h14M12 5v14" stroke-linecap="round"/></svg>
        </button>
        <input type="color" id="photo-color-picker" class="photo-color-picker" value="#ff2d55" title="顏色" />
        <input type="range" id="photo-stroke-width" class="photo-stroke-range" min="2" max="24" value="6" title="粗細" />
        <button type="button" class="icon-btn" id="photo-undo-btn" title="復原上一筆">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 8 3 12l4 4M3 12h11a5 5 0 0 1 0 10h-2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="icon-btn icon-btn-danger" id="photo-clear-btn" title="清除全部標記">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m1 0-.8 12.1a1 1 0 0 1-1 1H8.8a1 1 0 0 1-1-1L7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="photo-editor-canvas-wrap" id="photo-editor-canvas-wrap">
        <canvas id="photo-editor-canvas"></canvas>
      </div>
      <div class="modal-footer">
        <div class="modal-footer-right">
          <button class="btn btn-ghost" id="photo-editor-cancel-btn">取消</button>
          <button class="btn btn-primary" id="photo-editor-save-btn">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Photo viewer (view / zoom only, no editing) -->
  <div class="photo-viewer-backdrop" id="modal-photo-viewer">
    <button class="icon-btn photo-viewer-close" id="photo-viewer-close-btn" title="關閉">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg>
    </button>
    <span class="photo-viewer-count" id="photo-viewer-count"></span>
    <button class="icon-btn photo-viewer-nav photo-viewer-prev" id="photo-viewer-prev-btn" title="上一張">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="photo-viewer-stage" id="photo-viewer-stage">
      <img id="photo-viewer-img" src="" alt="照片" draggable="false" />
    </div>
    <button class="icon-btn photo-viewer-nav photo-viewer-next" id="photo-viewer-next-btn" title="下一張">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- Category modal -->
  <div class="modal-backdrop" id="modal-category">
    <div class="modal-sheet modal-sheet-sm">
      <div class="modal-header">
        <h3 id="category-modal-title">新增類別</h3>
        <button class="icon-btn" id="category-cancel-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field-label">類別名稱</label>
        <input type="text" id="category-field-name" class="field-input" placeholder="例如：商店街(工務)" />
      </div>
      <div class="modal-footer">
        <div class="modal-footer-right">
          <button class="btn btn-ghost" id="category-cancel-footer-btn">取消</button>
          <button class="btn btn-primary" id="category-save-btn">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Light timer modal (Admin only) -->
  <div class="modal-backdrop" id="modal-timer">
    <div class="modal-sheet modal-sheet-sm">
      <div class="modal-header">
        <h3 id="timer-modal-title">新增地點</h3>
        <button class="icon-btn" id="timer-cancel-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field-label">地點名稱</label>
        <input type="text" id="timer-field-location" class="field-input" placeholder="例如：A區街燈" />

        <label class="field-label">夏季</label>
        <div class="timer-time-row">
          <input type="text" id="timer-field-summer-start" class="field-input" placeholder="開始" />
          <span class="meta-sep">～</span>
          <input type="text" id="timer-field-summer-end" class="field-input" placeholder="結束" />
        </div>

        <label class="field-label">春秋季節</label>
        <div class="timer-time-row">
          <input type="text" id="timer-field-spring-start" class="field-input" placeholder="開始" />
          <span class="meta-sep">～</span>
          <input type="text" id="timer-field-spring-end" class="field-input" placeholder="結束" />
        </div>

        <label class="field-label">冬季節</label>
        <div class="timer-time-row">
          <input type="text" id="timer-field-winter-start" class="field-input" placeholder="開始" />
          <span class="meta-sep">～</span>
          <input type="text" id="timer-field-winter-end" class="field-input" placeholder="結束" />
        </div>

        <label class="field-label">備註</label>
        <input type="text" id="timer-field-note" class="field-input" placeholder="選填" />
      </div>
      <div class="modal-footer">
        <div class="modal-footer-right">
          <button class="btn btn-ghost" id="timer-cancel-footer-btn">取消</button>
          <button class="btn btn-primary" id="timer-save-btn">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Maintenance task modal (Admin only) -->
  <div class="modal-backdrop" id="modal-maintenance">
    <div class="modal-sheet modal-sheet-sm">
      <div class="modal-header">
        <h3 id="maintenance-modal-title">新增保養項目</h3>
        <button class="icon-btn" id="maintenance-cancel-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field-label">項目名稱</label>
        <input type="text" id="maintenance-field-name" class="field-input" placeholder="例如：澆灌系統檢查及調整" />

        <div class="field-row">
          <div>
            <label class="field-label">頻率標示</label>
            <input type="text" id="maintenance-field-frequency" class="field-input" placeholder="例如：★季" />
          </div>
          <div>
            <label class="field-label">次數/年</label>
            <input type="text" id="maintenance-field-times" class="field-input" placeholder="例如：4次/年" />
          </div>
        </div>

        <label class="field-label">適用月份</label>
        <div class="month-toggle-grid" id="maintenance-field-active-months"></div>

        <label class="field-label">月份說明（選填，留空則自動產生）</label>
        <input type="text" id="maintenance-field-months-text" class="field-input" placeholder="例如：依農曆節氣(春、夏、秋、冬)" />
      </div>
      <div class="modal-footer">
        <div class="modal-footer-right">
          <button class="btn btn-ghost" id="maintenance-cancel-footer-btn">取消</button>
          <button class="btn btn-primary" id="maintenance-save-btn">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Maintenance reminder popup -->
  <div class="modal-backdrop" id="modal-maintenance-reminder">
    <div class="modal-sheet modal-sheet-sm">
      <div class="modal-header">
        <h3 id="maintenance-reminder-title">本月保養提醒</h3>
        <button class="icon-btn" id="maintenance-reminder-close-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <p class="settings-note" id="maintenance-reminder-intro">以下項目本月需要執行保養：</p>
        <ul class="maintenance-reminder-list" id="maintenance-reminder-list"></ul>
      </div>
      <div class="modal-footer">
        <div class="modal-footer-right">
          <button class="btn btn-primary" id="maintenance-reminder-ok-btn">知道了</button>
        </div>
      </div>
    </div>
  </div>

  <!-- User modal (Admin only) -->
  <div class="modal-backdrop" id="modal-user">
    <div class="modal-sheet modal-sheet-sm">
      <div class="modal-header">
        <h3>新增帳號</h3>
        <button class="icon-btn" id="user-cancel-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field-label">帳號</label>
        <input type="text" id="user-field-username" class="field-input" autocomplete="off" />

        <label class="field-label">顯示名稱</label>
        <input type="text" id="user-field-displayname" class="field-input" placeholder="預設與帳號相同" />

        <label class="field-label">密碼</label>
        <input type="password" id="user-field-password" class="field-input" autocomplete="new-password" />

        <label class="field-label">角色</label>
        <select id="user-field-role" class="field-input field-select">
          <option value="User">一般使用者</option>
          <option value="Admin">管理員</option>
        </select>

        <label class="field-label">餐廳權限</label>
        <div id="user-field-departments-list"></div>
      </div>
      <div class="modal-footer">
        <div class="modal-footer-right">
          <button class="btn btn-ghost" id="user-cancel-footer-btn">取消</button>
          <button class="btn btn-primary" id="user-save-btn">建立</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reset password modal (Admin only) -->
  <div class="modal-backdrop" id="modal-reset-password">
    <div class="modal-sheet modal-sheet-sm">
      <div class="modal-header">
        <h3>重設密碼</h3>
        <button class="icon-btn" id="reset-password-cancel-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field-label">新密碼</label>
        <input type="password" id="reset-password-field" class="field-input" autocomplete="new-password" />
      </div>
      <div class="modal-footer">
        <div class="modal-footer-right">
          <button class="btn btn-ghost" id="reset-password-cancel-footer-btn">取消</button>
          <button class="btn btn-primary" id="reset-password-save-btn">更新密碼</button>
        </div>
      </div>
    </div>
  </div>

  <!-- User departments modal (Admin only) -->
  <div class="modal-backdrop" id="modal-user-departments">
    <div class="modal-sheet modal-sheet-sm">
      <div class="modal-header">
        <h3>餐廳權限</h3>
        <button class="icon-btn" id="user-departments-cancel-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body" id="user-departments-list"></div>
      <div class="modal-footer">
        <div class="modal-footer-right">
          <button class="btn btn-ghost" id="user-departments-cancel-footer-btn">取消</button>
          <button class="btn btn-primary" id="user-departments-save-btn">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <div id="print-area" class="print-area"></div>
